plugins {
    alias(libs.plugins.android.application)
    alias(libs.plugins.google.devtools.ksp)
    alias(libs.plugins.jetbrains.kotlin.android)
}

android {
    namespace 'com.example.payjp.checkout'
    compileSdk rootProject.sdkVersion

    defaultConfig {
        applicationId "com.example.payjp.checkout"
        minSdkVersion rootProject.minSdkVersion
        targetSdkVersion rootProject.sdkVersion
        versionCode rootProject.numberOfCommits
        versionName VERSION_NAME
    }

    sourceSets.configureEach {
        java.srcDirs += "src/${name}/kotlin"
    }

    buildTypes {
        debug {
            debuggable true
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
        release {
            shrinkResources true
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.debug
        }
    }

    kotlin {
        jvmToolchain 17
    }

    buildFeatures {
        viewBinding = true
        buildConfig = true
    }
}

dependencies {
    implementation project(':payjp-android-main')
    implementation project(':payjp-android-coroutine')

    implementation libs.kotlin.stdlib
    implementation libs.kotlinx.coroutines.core
    implementation libs.kotlinx.coroutines.android
    implementation libs.androidx.core.ktx
    implementation libs.androidx.appcompat
    implementation libs.androidx.recyclerview
    implementation libs.androidx.material
    implementation libs.androidx.browser

    implementation libs.okHttp3.core
    implementation libs.okHttp3.loggingInterceptor
    implementation libs.moshi.core
    ksp libs.moshi.codegen
    implementation libs.retrofit.core
    implementation libs.retrofit.moshi

    testImplementation libs.androidx.junit.ktx
    testImplementation libs.robolectric
    testImplementation libs.okHttp3.mockServer
    testImplementation libs.moshi.core
    testImplementation libs.kotlinx.coroutines.core
}
